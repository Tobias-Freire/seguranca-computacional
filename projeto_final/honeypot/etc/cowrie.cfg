# Configuração do honeypot Cowrie. Sobrescreve apenas o necessário sobre cowrie.cfg.dist.

[honeypot]
hostname = srv-backup01
# Mantém o nome do sensor nos logs JSON (campo "sensor")
sensor_name = srv-backup01

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
# Telnet desligado por padrão (extensão futura)
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[shell]
# Sem limite de downloads por minuto: os cenários repetem o wget várias vezes em poucos segundos
wget_rate_limit_enabled = false
curl_rate_limit_enabled = false
